# This workflow publishes the crate with release-plz.
#
# The version and CHANGELOG.md are maintained by hand, in the same pull
# request as the change they describe (see AGENTS.md). This workflow does
# not open release pull requests and does not touch the changelog. Its only
# job is to notice that `main` carries a version which is not yet on
# crates.io, publish it, tag it, and cut the GitHub release with the body
# taken from the matching CHANGELOG.md section.
#
# A push that does not change the version is a no-op.
#
# Publishing uses crates.io Trusted Publishing. There is deliberately no
# CARGO_REGISTRY_TOKEN secret and no rust-lang/crates-io-auth-action step:
# release-plz performs the OIDC token exchange itself, and only needs the
# id-token: write permission.
#
# Trusted Publishing must also be configured on crates.io for this crate, at
# https://crates.io/crates/tmp108/settings, with:
#
#   Repository owner:  OpenDevicePartnership
#   Repository name:   tmp108
#   Workflow filename: release.yml
#
# The workflow filename is part of the trust relationship, so renaming this
# file means updating it on crates.io too.
permissions:
  contents: read

on:
  push:
    branches: [main]

name: release

jobs:
  release:
    runs-on: ubuntu-latest
    name: release
    # Never run in forks: they have no crates.io trust relationship, and the
    # job would fail on every push.
    if: ${{ github.repository_owner == 'OpenDevicePartnership' }}

    permissions:
      # Push the tag and create the GitHub release.
      contents: write
      # Detect the commits belonging to the merged pull request.
      pull-requests: read
      # Mint the short-lived crates.io token via OIDC.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
