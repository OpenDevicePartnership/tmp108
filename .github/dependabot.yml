version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    # Cap the number of concurrently open PRs rather than filtering by update
    # type. An `ignore` rule on semver-patch and semver-minor also suppresses
    # Dependabot *security* updates, and since security fixes almost always
    # ship as patch or minor releases, that silences nearly all of them.
    #
    # Patch and minor bumps genuinely don't matter to consumers of this
    # library, who build with their own lockfile. They do matter to this
    # repository's CI, which runs every job with `--locked` and checks the
    # committed lockfile with `cargo deny`.
    open-pull-requests-limit: 5
